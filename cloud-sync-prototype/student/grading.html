<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批改讲解 · 学生端 · 孔孟·智学云</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .cm-item{ cursor:default; }
  .cm-item.unread{ border-color:var(--primary); background:var(--primary-50); }
  .grade-chip{ font-size:var(--fs-sm); font-weight:700; color:var(--primary); background:var(--primary-100); padding:2px 10px; border-radius:999px; }
  .explain-box{ background:var(--ink-50); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; }
  .explain-box .ex-head{ display:flex; align-items:center; gap:var(--space-2); font-size:var(--fs-xs); color:var(--ink-500); font-weight:600; margin-bottom:6px; }
  .cm-comment{ font-size:var(--fs-sm); color:var(--ink-700); }
  .section-title{ font-weight:600; color:var(--ink-900); font-size:var(--fs-md); margin-bottom:var(--space-3); }
</style>
</head>
<body>
<script src="../assets/mock.js"></script>
<script src="../assets/api.js"></script>
<script src="../assets/components.js"></script>
<script>
renderShell('student','grading');

var root = pageRoot();
var student = store.getStudent();
var className = store.getClass(student.classId).name;

function commentsList() {
  return store.studentComments();
}

function homeworkTitle(hwId) {
  var h = DB.homework.find(function(x){ return x.id === hwId; });
  return h ? h.title : '（作业已删除）';
}

function renderComments(list) {
  if (!list.length) return emptyState('暂无批改记录，点击「同步接收批改」检查云端。', 'check');
  return '<div class="grid">' + list.map(function(c) {
    var unread = !c.readByStudent;
    return '<div class="list-item cm-item' + (unread ? ' unread' : '') + '">' +
      '<div class="li-head"><div class="li-title">' + escapeHtml(homeworkTitle(c.homeworkId)) + '</div><div class="flex items-center gap-2">' + (unread ? statusBadge('unread') : statusBadge('read')) + '</div></div>' +
      '<div class="li-meta">' + subjectBadge(c.subject) + classBadge(className) +
        '<span>' + icon('eye') + '批改日期 ' + escapeHtml(c.gradedAt) + '</span>' +
        '<span class="grade-chip">评分 ' + escapeHtml(c.grade) + '</span>' +
      '</div>' +
      '<div class="cm-comment">' + icon('message') + ' 评语：' + escapeHtml(c.comment) + '</div>' +
      '<div class="explain-box mt-2"><div class="ex-head">' + icon('book') + '老师讲解</div><div class="text-sm" style="color:var(--ink-700);">' + escapeHtml(c.explanation) + '</div></div>' +
      '<div class="li-foot mt-2">' +
        (unread
          ? '<button class="btn btn-ghost btn-sm" onclick="markRead(\'' + c.id + '\')">' + icon('check') + '标记已读</button>'
          : '<span class="text-xs text-sub">' + icon('check') + ' 已读</span>') +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

function render() {
  root.innerHTML =
    '<div class="page-head">' +
      '<div><h1>批改讲解</h1><div class="sub">查看作业批改结果与老师讲解 · ' + className + ' · ' + student.name + '</div></div>' +
      '<div class="page-actions"><button class="btn btn-primary btn-md" id="syncBtn" onclick="syncNow()">' + icon('download') + '同步接收批改</button></div>' +
    '</div>' +
    '<div class="section-title">批改记录</div>' +
    renderComments(commentsList());
}

function syncNow() {
  var btn = document.getElementById('syncBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '同步中…'; }
  API.syncComments().then(function(res) {
    var unread = res.list.filter(function(c){ return !c.readByStudent; }).length;
    toast('已同步批改，其中未读 ' + unread + ' 条', 'success');
    render();
  });
}

function markRead(id) {
  API.markRead({ id: id }).then(function() {
    toast('已标记为已读', 'success');
    render();
  });
}

render();
</script>
</body>
</html>
