<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>高中各科知识图谱</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;background:#fafaf5;color:#2C2C2C;overflow:hidden;}
#app{display:flex;height:100vh;}

/* 侧边栏 */
#sidebar{width:210px;background:#fff;border-right:1px solid #E8E8E8;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-header{padding:24px 20px 20px;border-bottom:1px solid #E8E8E8;}
.sidebar-header h1{font-size:20px;color:#8B2C2C;font-weight:700;letter-spacing:2px;}
.sidebar-header p{font-size:11px;color:#999;margin-top:4px;letter-spacing:1px;}
#subject-list{flex:1;overflow-y:auto;padding:12px 0;}
.subject-btn{display:flex;align-items:center;width:100%;padding:10px 20px;border:none;background:none;cursor:pointer;font-size:14px;color:#2C2C2C;transition:all 0.2s;text-align:left;font-family:inherit;}
.subject-btn:hover{background:#fafaf5;color:#8B2C2C;}
.subject-btn.active{background:#8B2C2C;color:#fff;}
.subject-icon{width:30px;height:30px;border-radius:50%;background:#C4A35A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:10px;flex-shrink:0;font-weight:600;}
.subject-btn.active .subject-icon{background:#fff;color:#8B2C2C;}
.subject-btn span{flex:1;}
.subject-btn .count{font-size:11px;color:#aaa;}
.subject-btn.active .count{color:#ddd;}
.sidebar-footer{padding:12px 20px;border-top:1px solid #E8E8E8;font-size:11px;color:#aaa;text-align:center;}

/* 主区域 */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#header{height:56px;background:#fff;border-bottom:1px solid #E8E8E8;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
#header h2{font-size:18px;color:#2C2C2C;font-weight:600;}
#header h2 .sub{font-size:12px;color:#999;font-weight:400;margin-left:8px;}
.header-controls{display:flex;gap:8px;}
.ctrl-btn{padding:6px 14px;border:1px solid #E8E8E8;background:#fff;color:#666;font-size:12px;cursor:pointer;border-radius:4px;transition:all 0.2s;font-family:inherit;}
.ctrl-btn:hover{border-color:#C4A35A;color:#8B2C2C;}
.ctrl-btn.active{background:#8B2C2C;color:#fff;border-color:#8B2C2C;}
#graph-container{flex:1;position:relative;overflow:hidden;}

/* 详情面板 */
#detail-panel{position:absolute;right:16px;top:16px;width:280px;background:#fff;border:1px solid #E8E8E8;border-radius:8px;padding:0;box-shadow:0 4px 16px rgba(0,0,0,0.08);z-index:50;display:none;max-height:calc(100vh - 100px);overflow-y:auto;}
#detail-panel.show{display:block;}
.detail-header{padding:16px 20px;border-bottom:1px solid #E8E8E8;display:flex;justify-content:space-between;align-items:center;}
.detail-header h3{font-size:16px;color:#8B2C2C;font-weight:600;}
.detail-close{cursor:pointer;color:#999;font-size:18px;line-height:1;}
.detail-close:hover{color:#8B2C2C;}
.detail-body{padding:16px 20px;}
.detail-cat{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;margin-bottom:12px;}
.detail-desc{font-size:13px;color:#555;line-height:1.8;margin-bottom:16px;}
.detail-section{margin-bottom:14px;}
.detail-section h4{font-size:12px;color:#999;margin-bottom:6px;font-weight:500;}
.detail-section .items{font-size:13px;color:#2C2C2C;line-height:1.8;}
.detail-section .items a{color:#8B2C2C;cursor:pointer;text-decoration:none;}
.detail-section .items a:hover{text-decoration:underline;}
.detail-empty{padding:40px 20px;text-align:center;color:#aaa;font-size:13px;}

/* 图例 */
#legend{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,0.92);border:1px solid #E8E8E8;border-radius:8px;padding:12px 16px;z-index:40;max-width:260px;}
#legend h4{font-size:11px;color:#999;margin-bottom:8px;font-weight:500;}
.legend-item{display:flex;align-items:center;margin-bottom:5px;font-size:12px;color:#555;}
.legend-dot{width:12px;height:12px;border-radius:50%;margin-right:8px;flex-shrink:0;}

/* 提示信息 */
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(44,44,44,0.7);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;z-index:40;pointer-events:none;}

/* 加载 */
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#aaa;font-size:14px;}

/* 滚动条 */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#ccc;}
</style>

      </div>
    </div>
    <div id="graph-container">

      <div id="legend"></div>
      <div id="detail-panel">

    </div>
  </div>
</div>

// ======================== 应用逻辑 ========================
let chart = null;
let currentSubject = '语文';
let showLabel = true;
let currentData = null;

// 初始化侧边栏
function initSidebar() {
  const list = document.getElementById('subject-list');
  list.innerHTML = '';
  Object.keys(SUBJECTS).forEach((name, idx) => {
    const s = SUBJECTS[name];
    const btn = document.createElement('button');
    btn.className = 'subject-btn' + (idx === 0 ? ' active' : '');
    btn.innerHTML = `<div class="subject-icon">${s.icon}</div><span>${name}</span><span class="count">${s.nodes.length}节点</span>`;
    btn.onclick = () => switchSubject(name);
    list.appendChild(btn);
  });
}

// 切换科目
function switchSubject(name) {
  currentSubject = name;
  document.querySelectorAll('.subject-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', Object.keys(SUBJECTS)[idx] === name);
  });
  const s = SUBJECTS[name];
  document.getElementById('current-subject').innerHTML = `${name}<span class="sub" id="current-desc">${s.desc}</span>`;
  renderGraph(name);
  hideDetail();
}

// 渲染图谱
function renderGraph(name) {
  const s = SUBJECTS[name];
  currentData = s;

  // 构建节点
  const categories = s.cats.map((c, i) => ({ name: c, itemStyle: { color: s.colors[i] } }));
  const nodes = s.nodes.map(n => ({
    name: n[0],
    category: n[1],
    value: n[2],
    symbolSize: n[2],
    desc: n[3],
    label: { show: showLabel, position: 'right', fontSize: 11, color: '#2C2C2C' },
    itemStyle: { borderColor: '#fff', borderWidth: 2 }
  }));

  // 构建连接
  const links = s.links.map(l => ({
    source: l[0],
    target: l[1],
    label: { show: false, formatter: l[2], fontSize: 10, color: '#aaa' },
    lineStyle: { color: '#ccc', width: 1, curveness: 0.15, opacity: 0.6 }
  }));

  const option = {
    tooltip: {
      formatter: function(p) {
        if (p.dataType === 'node') {
          const cat = s.cats[p.data.category];
          return `<b style="color:${s.colors[p.data.category]}">${p.data.name}</b><br><span style="color:#999;font-size:12px">分类: ${cat}</span><br><span style="font-size:12px">${p.data.desc || ''}</span>`;
        } else if (p.dataType === 'edge') {
          return `${p.data.source} <span style="color:#8B2C2C">→${p.data.label.label.formatter}→</span> ${p.data.target}`;
        }
      },
      backgroundColor: 'rgba(255,255,255,0.95)',
      borderColor: '#E8E8E8',
      borderWidth: 1,
      padding: [8, 12],
      textStyle: { color: '#2C2C2C', fontSize: 12 }
    },
    legend: [{ show: false }],
    series: [{
      type: 'graph',
      layout: 'force',
      roam: true,
      draggable: true,
      categories: categories,
      data: nodes,
      links: links,
      force: {
        repulsion: 300,
        edgeLength: [80, 160],
        gravity: 0.08,
        friction: 0.6
      },
      scaleLimit: { min: 0.3, max: 3 },
      lineStyle: { color: '#ccc', width: 1, curveness: 0.15, opacity: 0.6 },
      emphasis: {
        focus: 'adjacency',
        lineStyle: { width: 2, color: '#8B2C2C', opacity: 1 },
        label: { show: true, fontSize: 12, fontWeight: 'bold' },
        itemStyle: { shadowBlur: 10, shadowColor: 'rgba(139,44,44,0.3)' }
      },
      edgeLabel: { show: false }
    }]
  };

  if (!chart) {
    chart = echarts.init(document.getElementById('graph'));
    chart.on('click', function(params) {
      if (params.dataType === 'node') showDetail(params.data);
    });
    window.addEventListener('resize', () => chart && chart.resize());
  }
  chart.setOption(option, true);

  // 渲染图例
  renderLegend(s);
}

// 渲染图例
function renderLegend(s) {
  const legend = document.getElementById('legend');
  let html = '<h4>知识分类</h4>';
  s.cats.forEach((cat, i) => {
    html += `<div class="legend-item"><div class="legend-dot" style="background:${s.colors[i]}"></div>${cat}</div>`;
  });
  legend.innerHTML = html;
}

// 显示详情
function showDetail(node) {
  const s = currentData;
  const panel = document.getElementById('detail-panel');
  document.getElementById('detail-title').textContent = node.name;

  const cat = s.cats[node.category];
  const catColor = s.colors[node.category];

  // 找出关联节点
  const related = [];
  s.links.forEach(l => {
    if (l[0] === node.name) related.push({ name: l[1], type: l[2], dir: '→' });
    else if (l[1] === node.name) related.push({ name: l[0], type: l[2], dir: '←' });
  });

  let html = `<span class="detail-cat" style="background:${catColor}20;color:${catColor}">${cat}</span>`;
  html += `<div class="detail-desc">${node.desc || '暂无描述'}</div>`;

  if (related.length > 0) {
    html += `<div class="detail-section"><h4>关联知识点（${related.length}）</h4><div class="items">`;
    related.forEach(r => {
      html += `<div>${r.dir} <a onclick="focusNode('${r.name}')">${r.name}</a> <span style="color:#aaa;font-size:11px">(${r.type})</span></div>`;
    });
    html += `</div></div>`;
  }

  html += `<div class="detail-section"><h4>重要程度</h4><div class="items">${'★'.repeat(Math.ceil(node.value/6))}${'☆'.repeat(5-Math.ceil(node.value/6))}</div></div>`;

  document.getElementById('detail-body').innerHTML = html;
  panel.classList.add('show');
}

// 隐藏详情
function hideDetail() {
  document.getElementById('detail-panel').classList.remove('show');
}

// 聚焦节点
function focusNode(name) {
  if (!chart) return;
  const option = chart.getOption();
  const nodes = option.series[0].data;
  const node = nodes.find(n => n.name === name);
  if (node) {
    showDetail(node);
    chart.dispatchAction({ type: 'highlight', seriesIndex: 0, name: name });
    setTimeout(() => chart.dispatchAction({ type: 'downplay', seriesIndex: 0, name: name }), 2000);
  }
}

// 控制按钮
document.getElementById('btn-refresh').onclick = () => {
  if (chart) {
    chart.setOption({ series: [{ force: { layoutAnimation: true } }] });
    renderGraph(currentSubject);
  }
};

document.getElementById('btn-label').onclick = function() {
  showLabel = !showLabel;
  this.classList.toggle('active', showLabel);
  this.textContent = showLabel ? '显示标签' : '隐藏标签';
  renderGraph(currentSubject);
};

document.getElementById('btn-fullscreen').onclick = function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
    this.textContent = '退出全屏';
  } else {
    document.exitFullscreen();
    this.textContent = '全屏';
  }
};

document.getElementById('detail-close').onclick = hideDetail;

// 启动
initSidebar();
renderGraph('语文');
</script>
