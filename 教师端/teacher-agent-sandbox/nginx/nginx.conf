worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    # 上游服务：Python沙箱(8000) + Node.js沙箱(8001)
    upstream python_sandbox {
        server sandbox:8000;
    }
    
    upstream node_sandbox {
        server sandbox:8001;
    }
    
    server {
        listen 80;
        server_name localhost;
        
        # Python沙箱API
        location /api/python/ {
            proxy_pass http://python_sandbox/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        
        # Node.js沙箱API
        location /api/node/ {
            proxy_pass http://node_sandbox/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
        
        # 文件下载（直接访问Python沙箱的文件服务）
        location /files/ {
            proxy_pass http://python_sandbox/files/;
            proxy_set_header Host $host;
        }
        
        # 健康检查
        location /health {
            proxy_pass http://python_sandbox/health;
            proxy_set_header Host $host;
        }
        
        # 静态文件（工作区）
        location /workspace/ {
            alias /sandbox/workspace/;
            autoindex on;
        }
    }
}
