startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/sandbox/logs/mcp-time.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/sandbox/logs/mcp-time-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
