# ============================================================
# 教师备课智能体 · Supervisor 进程管理配置
# ------------------------------------------------------------
# 管理沙箱容器内所有常驻服务:
#   1. python-sandbox   FastAPI Python 沙箱 (:8000)
#   2. node-sandbox     Node.js 沙箱 (:8001)
#   3. redis            Redis 缓存与记忆服务
#   4. mcp-filesystem   MCP 文件系统服务器
#   5. mcp-fetch        MCP 网络抓取服务器
#   6. mcp-memory       MCP 记忆服务器
#   7. mcp-time         MCP 时间服务器
#   8. mcp-sequential-thinking  MCP 顺序思维服务器
#
# 日志输出: /sandbox/logs/<program>.log (stdout + stderr 分离)
# ============================================================

[supervisord]
nodaemon=true
logfile=/sandbox/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
pidfile=/sandbox/supervisord.pid
user=root
minfds=1024
minprocs=200

# ----------------------------------------------------------------
# 1. Python 沙箱: FastAPI 服务 (端口 8000)
# ----------------------------------------------------------------
[program:python-sandbox]
command=uvicorn sandbox_api:app --host 0.0.0.0 --port 8000
directory=/sandbox
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stdout_logfile=/sandbox/logs/python-sandbox.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/sandbox/logs/python-sandbox-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
user=teacher

# ----------------------------------------------------------------
# 2. Node.js 沙箱: Express/HTTP 服务 (端口 8001)
# ----------------------------------------------------------------
[program:node-sandbox]
command=node node-sandbox.js
directory=/sandbox
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=15
stdout_logfile=/sandbox/logs/node-sandbox.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/sandbox/logs/node-sandbox-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=NODE_ENV="production",PORT="8001"
user=teacher

# ----------------------------------------------------------------
# 3. Redis: 缓存与记忆后端
# ----------------------------------------------------------------
[program:redis]
command=redis-server --daemonize no --dir /sandbox/data --appendonly yes
directory=/sandbox
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stdout_logfile=/sandbox/logs/redis.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/sandbox/logs/redis-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

# ----------------------------------------------------------------
# 4. MCP 文件系统服务器: 提供工作区文件操作能力
# ----------------------------------------------------------------
[program:mcp-filesystem]
command=npx -y @modelcontextprotocol/server-filesystem /sandbox/workspace
directory=/sandbox
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/sandbox/logs/mcp-filesystem.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/sandbox/logs/mcp-filesystem-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
user=teacher

# ----------------------------------------------------------------
# 5. MCP 网络抓取服务器: 提供网页内容获取能力
# ----------------------------------------------------------------
[program:mcp-fetch]
command=npx -y @modelcontextprotocol/server-fetch
directory=/sandbox
autostart=true
autorestart=true
startsecs=5
startretries=3
