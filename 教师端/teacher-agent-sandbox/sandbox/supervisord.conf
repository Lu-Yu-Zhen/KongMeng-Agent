stdout_logfile_backups=2
stderr_logfile=/sandbox/logs/mcp-memory-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
user=teacher

# ----------------------------------------------------------------
# 7. MCP 时间服务器: 提供时间与时区查询
# ----------------------------------------------------------------
