stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/sandbox/logs/mcp-fetch-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
user=teacher

# ----------------------------------------------------------------
# 6. MCP 记忆服务器: 提供知识图谱与长期记忆
# ----------------------------------------------------------------
[program:mcp-memory]
command=npx -y @modelcontextprotocol/server-memory
directory=/sandbox
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
